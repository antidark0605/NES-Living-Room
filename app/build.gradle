plugins { id 'com.android.application' }

android {
    namespace 'dev.antidark.neslivingroom'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.antidark.neslivingroom'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
